<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mach Cone Simulation</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <h2>Mach Cone Shockwave Simulation</h2>
    
    <div class="controls">
      <label for="machSlider">Speed / Mach Number: <span id="machVal">1.5</span></label>
      <input type="range" id="machSlider" min="0.5" max="3.0" step="0.1" value="1.5">
    </div>

    <div class="stats">
      <p>Regime: <strong id="regimeText">Supersonic</strong></p>
      <p>Mach Angle (&theta;): <strong id="angleText">41.8°</strong></p>
    </div>

    <canvas id="simCanvas" width="700" height="400"></canvas>
  </div>

  <script src="./script.js?v=99"></script>
</body>
</html>
